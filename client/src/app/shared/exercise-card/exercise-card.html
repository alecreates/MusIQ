<li class="list-row card card-border border-2 bg-base-100
transition-all duration-200 ease-out
hover:-translate-y-1 hover:shadow-lg
cursor-pointer group relative">

    <!-- Icon -->
    <div class="flex items-center justify-center">
        <div class="bg-base-200 rounded-box size-12 flex items-center justify-center text-xl">
            {{ icon() }}
        </div>
    </div>

    <!-- Title -->
    <div>
        <div class="font-semibold">
            {{ title() }}
        </div>

        <div class="text-xs uppercase font-semibold opacity-60">
            {{ difficulty() }} • {{ time() }}
        </div>
    </div>

    <!-- Description -->
    <p class="list-col-wrap text-sm opacity-70">
        {{ description() }}
    </p>

    <!-- Start -->
    <button class="btn btn-primary btn-sm" (click)="start.emit(route())">
        Start
    </button>

</li>
