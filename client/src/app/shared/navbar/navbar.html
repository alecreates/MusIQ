<div class="max-lg:collapse bg-base-200 w-full fixed top-0 left-0 z-50 h-16 border-b border-base-300">    <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
    <label for="navbar-1-toggle" class="fixed inset-0 hidden max-lg:peer-checked:block"></label>
    <div class="collapse-title navbar">
        <div class="navbar-start">
            <label for="navbar-1-toggle" class="btn btn-ghost lg:hidden">
                <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
                </svg>
            </label>
            <button class="btn btn-ghost text-2xl" 
                routerLink="" 
                routerLinkActive="bg-base-300 font-bold"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                MusIQ
            </button>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li>
                    <button class="text-lg" routerLink="learn" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }"
                    >
                        Learn
                    </button>
                </li>
                <li>
                    <button class="text-lg" routerLink="practice" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }"
                    >
                        Practice
                    </button>
                </li>
                <li>
                    <button class="text-lg" routerLink="play" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }"
                    >
                        Play!
                    </button>
                </li>
            </ul>
        </div>
        <div class="navbar-end">
            <input type="text" placeholder="Search" class="input w-64 lg:w-auto" />

            <div class="dropdown dropdown-end px-3">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                    <div class="w-10 rounded-full">
                        <img alt="Tailwind CSS Navbar component"
                            src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />
                    </div>
                </div>
                <ul tabindex="-1"
                    class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                    <li>
                        <a class="justify-between">
                            Profile
                            <span class="badge">New</span>
                        </a>
                    </li>
                    <li><a>Settings</a></li>
                    <li><a>Logout</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="collapse-content lg:hidden z-1">
        <ul class="menu">
            <li>
                <button routerLink="learn" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }">Learn</button>
            </li>
            <li>
                <button routerLink="practice" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }">Practice</button>
            </li>
            <li>
                <button routerLink="play" 
                        routerLinkActive="bg-base-300 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }">Play!</button>
            </li>
        </ul>
    </div>
</div>

<main class="pt-16">
    <router-outlet></router-outlet>
</main>
