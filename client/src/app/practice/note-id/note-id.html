<h1 class="text-center text-4xl p-5">Note Identification</h1>

@if (isCustomize) {
    <form [formGroup]="customizeForm" (ngSubmit)="startPractice()">
        <div class="m-auto w-full max-w-2xl px-4">
            <div class="card card-border border-2 bg-base-100 rounded-lg shadow-md">
                <div class="card-body gap-6">
    
                    <!-- Header -->
                    <div>
                        <h2 class="card-title text-2xl">
                            Customize Your Practice
                        </h2>
                        <p class="text-base-content/60 mt-1">
                            Choose how you'd like to practice note identification.
                        </p>
                    </div>
    
                    <!-- Accidentals -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Accidentals</span>
                        </label>
    
                        <select class="select select-bordered w-full cursor-pointer"
                        formControlName="accidentals">
                            <option value="both">Flats & Sharps</option>
                            <option value="flats">Flats</option>
                            <option value="sharps">Sharps</option>
                            <option value="none">None</option>
                        </select>
                    </div>
    
                    <!-- Note Range -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Note Range</span>
                        </label>
    
                        <select class="select select-bordered w-full cursor-pointer"
                        formControlName="noteRange">
                            <option value="C4-C5">C4 - C5</option>
                            <option value="G3-C4">G3 - C4</option>
                            <option value="C4-G5">C4 - G5</option>
                            <option value="G3-G5">G3 - G5</option>
                        </select>
                    </div>
    
                    <!-- Clefs -->
                    <div class="form-control">
    
                        <label class="label">
                            <span class="label-text font-medium">
                                Clefs
                            </span>
                        </label>
    
                        <p class="text-sm text-base-content/60 mb-3">
                            Choose one or more clefs to practice.
                        </p>
    
                        <div class="grid grid-cols-2 gap-3">
    
                            <!-- Treble -->
                            <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer
                          hover:bg-base-200 transition-colors">
                                <input type="checkbox" class="checkbox checkbox-primary" checked formControlName="treble"/>
                                <div>
                                    <p class="font-medium">Treble</p>
                                </div>
                            </label>
    
                            <!-- Bass -->
                            <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer
                          hover:bg-base-200 transition-colors">
                                <input type="checkbox" class="checkbox checkbox-primary" formControlName="bass"/>
                                <div>
                                    <p class="font-medium">Bass</p>
                                </div>
                            </label>
    
                            <!-- Alto -->
                            <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer
                          hover:bg-base-200 transition-colors">
                                <input type="checkbox" class="checkbox checkbox-primary" formControlName="alto"/>
                                <div>
                                    <p class="font-medium">Alto</p>
                                </div>
                            </label>
    
                            <!-- Tenor -->
                            <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer
                          hover:bg-base-200 transition-colors">
                                <input type="checkbox" class="checkbox checkbox-primary" formControlName="tenor"/>
                                <div>
                                    <p class="font-medium">Tenor</p>
                                </div>
                            </label>
                        </div>
                    </div>
    
                    <!-- Number of Questions -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">
                                Number of Questions
                            </span>
                        </label>
    
                        <div class="flex gap-3 items-center">
                            <!-- Number input -->
                            <input min="1" max="100" class="input input-bordered w-full"
                                placeholder="Number of questions" formControlName="questionCount" />
    
                            <!-- Unlimited -->
                            <label class="label cursor-pointer gap-2 whitespace-nowrap">
                                <span class="label-text">Unlimited</span>
                                <input type="checkbox" class="checkbox checkbox-primary" formControlName="unlimited"/>
                            </label>
                        </div>
                    </div>
    
                    <!-- Divider -->
                    <div class="divider my-1"></div>
    
                    <!-- Start Button -->
                    <button class="btn btn-primary w-full">
                        Start Practice!
                    </button>
                </div>
            </div>
        </div>
    </form>
} @else {
    <div class="card card-border border-2 bg-base-100">
        <div class="card-body">
            @if (currentNote) {
                <app-note-id-staff [note]="currentNote"></app-note-id-staff>
            }
            <button
                class="btn btn-accent btn-sm relative z-10"
                (click)="nextQuestion()">
                Next
            </button>
        </div>
    </div>

}
